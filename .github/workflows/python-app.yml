name: VLESS Proxy Tunnel

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'مدت زمان اجرا (دقیقه)'
        required: false
        default: '360'

jobs:
  proxy-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🔑 Setup SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H localhost.run >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H ssh.localhost.run >> ~/.ssh/known_hosts 2>/dev/null || true
      
      - name: 🚀 Start Proxy Server
        run: |
          python proxy.py &
          echo $! > server.pid
          sleep 5
          
          # بررسی که سرور اجرا شده
          if ! kill -0 $(cat server.pid) 2>/dev/null; then
            echo "❌ سرور شروع نشد!"
            exit 1
          fi
          
          echo "✅ سرور روی پورت 8080 در حال اجرا است"
          curl -s http://localhost:8080 > /dev/null && echo "✅ سرور پاسخ می‌دهد" || echo "⚠️ سرور پاسخ نمی‌دهد"
      
      - name: 🌐 Create SSH Tunnel
        run: |
          echo "🔗 در حال ایجاد tunnel با localhost.run..."
          echo "⏰ زمان شروع: $(date)"
          
          # تلاش با localhost.run
          ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=3 \
              -o ExitOnForwardFailure=yes \
              -R 80:localhost:8080 \
              nokey@localhost.run 2>&1 | tee tunnel.log &
          
          TUNNEL_PID=$!
          echo $TUNNEL_PID > tunnel.pid
          
          # انتظار برای دریافت URL
          sleep 10
          
          # نمایش URL
          echo ""
          echo "======================================"
          if grep -q "tunneled with tls termination" tunnel.log; then
            TUNNEL_URL=$(grep -oP 'https://[^\s]+' tunnel.log | head -1)
            echo "✅ Tunnel آماده است!"
            echo "🌍 URL: $TUNNEL_URL"
            echo "======================================"
            echo ""
            echo "📝 کانفیگ VLESS خود را با این تنظیمات بروز کنید:"
            echo "   host=$TUNNEL_URL"
            echo ""
          else
            echo "⚠️ URL tunnel یافت نشد، لاگ کامل:"
            cat tunnel.log
          fi
          
          # نگه داشتن tunnel
          echo "🔄 Tunnel فعال است... (Ctrl+C برای خروج)"
          wait $TUNNEL_PID
      
      - name: 🧹 Cleanup
        if: always()
        run: |
          [ -f server.pid ] && kill $(cat server.pid) 2>/dev/null || true
          [ -f tunnel.pid ] && kill $(cat tunnel.pid) 2>/dev/null || true
          echo "✅ تمیزسازی انجام شد"
