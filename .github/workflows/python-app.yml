name: VLESS Proxy Tunnel

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'مدت زمان اجرا (دقیقه)'
        required: false
        default: '360'

jobs:
  proxy-tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🔑 Setup SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H localhost.run >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H ssh.localhost.run >> ~/.ssh/known_hosts 2>/dev/null || true
      
      - name: 🚀 Start Proxy Server
        run: |
          python proxy.py &
          echo $! > server.pid
          sleep 5
          
          # بررسی که سرور اجرا شده
          if ! kill -0 $(cat server.pid) 2>/dev/null; then
            echo "❌ سرور شروع نشد!"
            exit 1
          fi
          
          echo "✅ سرور روی پورت 8080 در حال اجرا است"
          curl -s http://localhost:8080 > /dev/null && echo "✅ سرور پاسخ می‌دهد" || echo "⚠️ سرور پاسخ نمی‌دهد"
      
      - name: 🌐 Create SSH Tunnel
        run: |
          echo "🔗 در حال ایجاد tunnel با localhost.run..."
          echo "⏰ زمان شروع: $(date)"
          echo ""
          
          # اجرای SSH tunnel و ذخیره لاگ
          ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=3 \
              -o ExitOnForwardFailure=yes \
              -R 80:localhost:8080 \
              nokey@localhost.run 2>&1 | tee tunnel.log &
          
          TUNNEL_PID=$!
          echo $TUNNEL_PID > tunnel.pid
          
          # انتظار برای ایجاد tunnel
          echo "⏳ در انتظار ایجاد tunnel..."
          sleep 15
          
          # استخراج URL از لاگ
          echo ""
          echo "======================================"
          echo "📋 لاگ کامل localhost.run:"
          echo "======================================"
          cat tunnel.log
          echo "======================================"
          echo ""
          
          # استخراج URL با روش‌های مختلف
          TUNNEL_URL=""
          
          # روش 1: جستجوی پترن tunneled with tls
          if grep -q "tunneled with tls termination" tunnel.log; then
            TUNNEL_URL=$(grep "tunneled with tls termination" tunnel.log | grep -oE 'https://[a-zA-Z0-9._-]+\.lhr\.life' | head -1)
          fi
          
          # روش 2: جستجوی هر lhr.life
          if [ -z "$TUNNEL_URL" ]; then
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9._-]+\.lhr\.life' tunnel.log | head -1)
          fi
          
          # روش 3: جستجوی هر .localhost.run
          if [ -z "$TUNNEL_URL" ]; then
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9._-]+\.localhost\.run' tunnel.log | head -1)
          fi
          
          # روش 4: جستجوی هر دامنه ممکن
          if [ -z "$TUNNEL_URL" ]; then
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9._-]+\.(lhr\.life|localhost\.run|lhrtunnel\.link)' tunnel.log | grep -v "twitter.com" | head -1)
          fi
          
          echo "======================================"
          if [ -n "$TUNNEL_URL" ]; then
            # حذف ] اگر وجود داشت
            TUNNEL_URL=$(echo "$TUNNEL_URL" | sed 's/\]$//')
            
            # استخراج فقط hostname بدون https://
            TUNNEL_HOST=$(echo "$TUNNEL_URL" | sed 's|https://||' | sed 's|http://||')
            
            echo "✅ Tunnel با موفقیت ایجاد شد!"
            echo ""
            echo "🌍 URL کامل: $TUNNEL_URL"
            echo "🏠 Host: $TUNNEL_HOST"
            echo ""
            echo "======================================"
            echo "📝 کانفیگ VLESS را بروز کنید:"
            echo "======================================"
            echo ""
            echo "فقط این پارامتر را عوض کنید:"
            echo "  host=$TUNNEL_HOST"
            echo ""
            echo "یا SNI:"
            echo "  sni=$TUNNEL_HOST"
            echo ""
            echo "مثال کانفیگ کامل:"
            echo "vless://Telegram-Parsashonam@13.52.188.95:443?..."
            echo "  &host=$TUNNEL_HOST"
            echo "  &sni=$TUNNEL_HOST"
            echo "  ...بقیه پارامترها بدون تغییر..."
            echo ""
            echo "======================================"
            
            # تست دسترسی
            echo ""
            echo "🧪 تست اتصال به tunnel..."
            if curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$TUNNEL_URL" | grep -q "200\|404\|400"; then
              echo "✅ Tunnel در دسترس است و پاسخ می‌دهد"
            else
              echo "⚠️ Tunnel ایجاد شده اما ممکن است هنوز آماده نباشد"
            fi
            
          else
            echo "⚠️ نتوانستیم URL را به صورت خودکار پیدا کنیم"
            echo ""
            echo "لطفاً URL را از لاگ بالا به صورت دستی پیدا کنید"
            echo "به دنبال چیزی شبیه این باشید:"
            echo "  - xxxxxx.lhr.life"
            echo "  - xxxxxx.localhost.run"
            echo "  - xxxxxx.lhrtunnel.link"
          fi
          echo "======================================"
          echo ""
          
          # نگه داشتن tunnel فعال
          echo "🔄 Tunnel فعال است و در حال اجرا... (حداکثر 6 ساعت)"
          echo "⏰ زمان فعلی: $(date)"
          echo ""
          
          # نمایش وضعیت هر 5 دقیقه
          while kill -0 $TUNNEL_PID 2>/dev/null; do
            sleep 300  # 5 دقیقه
            echo "💓 Tunnel همچنان فعال است - $(date)"
            
            # چک کردن سرور پایتون
            if ! kill -0 $(cat server.pid) 2>/dev/null; then
              echo "❌ سرور پایتون متوقف شده! در حال ریستارت..."
              python proxy.py &
              echo $! > server.pid
              sleep 3
            fi
          done
          
          echo "⚠️ Tunnel قطع شد"
      
      - name: 🧹 Cleanup
        if: always()
        run: |
          [ -f server.pid ] && kill $(cat server.pid) 2>/dev/null || true
          [ -f tunnel.pid ] && kill $(cat tunnel.pid) 2>/dev/null || true
          echo "✅ تمیزسازی انجام شد - $(date)"
